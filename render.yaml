services:
  # 1. 前端服务 (Static Site)
  - type: web
    name: admin-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. 后端服务 (Spring Boot Web Service)
  - type: web
    name: admin-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: admin-db
          property: connectionString

databases:
  # 3. 免费托管的 PostgreSQL 数据库
  - name: admin-db
    databaseName: ecommerce
    user: admin
